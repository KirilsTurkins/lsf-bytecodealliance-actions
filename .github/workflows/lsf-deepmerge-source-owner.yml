name: Verify reviewed deepmerge source and action bundles
on:
  push:
    branches: ['diag/deepmerge-source-owner-20261105']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LSF_OWNER_SHA256: '3c3d803d29edff752d5bd45fb5c94ecf99a1626ea26103d9f41aabe22291b04f'
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-node@fdae00b14e855eb751452bc70c64dde286270415
        with:
          node-version: '24.19.0'
      - name: Authenticate the exact reviewed source and baseline
        run: python3 -B .lsf-source/deepmerge-owner-check.py source
      - name: Install the locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Refuse seven tampered inputs and check the fixed merge behavior
        run: python3 -B .lsf-source/deepmerge-owner-check.py tamper
      - name: Build the TypeScript action
        run: npm run build
      - name: Run the existing action tests
        run: npm test -- --runInBand
      - name: Rebuild all three committed action bundles
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm run package
      - name: Verify exact final sources and bundle hashes
        run: python3 -B .lsf-source/deepmerge-owner-check.py final
      - name: Retain the source and bundle proof
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16
        with:
          name: lsf-bytecodealliance-deepmerge-source-${{ github.sha }}
          path: ${{ runner.temp }}/lsf-deepmerge-owner/result.json
          if-no-files-found: warn
          retention-days: 7
